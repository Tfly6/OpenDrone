Q_pos_x: 100.0
Q_pos_y: 100.0
Q_pos_z: 80.0

Q_quat_w: 0.5
Q_quat_x: 0.5
Q_quat_y: 0.5
Q_quat_z: 5.0

Q_vel_x: 5.0
Q_vel_y: 5.0
Q_vel_z: 3.0

R_rate_x: 15.0
R_rate_y: 15.0
R_rate_z: 10.0
R_thrust: 0.4

# Safety envelope for raw body-rate output.  Keep these separate from Q/R so
# aggressive tuning cannot command a non-recoverable attitude.
max_body_rate_xy: 0.8        # rad/s
max_body_rate_z: 0.6         # rad/s
max_tilt_deg: 30.0           # deg
tilt_recovery_gain: 1.5      # rad/s per rad of roll/pitch error
min_normalized_thrust: 0.15
max_normalized_thrust: 0.85
