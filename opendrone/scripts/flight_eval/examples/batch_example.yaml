# 先执行 --dry-run 检查展开结果：
# python3 -m flight_eval batch -f batch_example.yaml --dry-run
version: 1
# manifests:
#   - external_algorithm_manifest.yaml
name: online_mission_lidar

# 不指定 output_dir 时，会创建 eval_runs/batches/<name>_<timestamp>/。
# output_dir: ./results/controller_and_online_planner

defaults:
  simulation:
    # 必填。不从 ROS_PACKAGE_PATH 或 rospack 推断，因为 source devel/setup.bash 后
    # rospack find px4 不可靠。请改为本机 PX4-Autopilot 的绝对路径。
    px4:
      source_dir: /home/test/PX4-Autopilot
      # build_dir: /path/to/PX4-Autopilot/build/px4_sitl_default
      sim_model: gazebo-classic_iris
    # Gazebo 与 PX4 使用可重连的 UDP 链路。先运行 prepare-environment，再 source
    # 生成的 environment.env 并手动启动 environment.launch。
    transport:
      gazebo_px4: udp
      port: 14560
      environment_dir: /tmp/flight_eval_udp_environment
    mavros:
      fcu_url: udp://:14540@localhost:14557
      # batch 每条样本都会重启 PX4，MAVROS 必须能自动恢复。
      respawn_mavros: true
    gazebo:
      # 未指定 gui 时默认 true；批量实验默认显示 Gazebo GUI。
      gui: false
      # batch 每条样本都会重启 PX4，Gazebo 必须能自动恢复。
      respawn_gazebo: true
      x: 0
      y: 0
      z: 0
  run:
    takeoff_height: 2.0
    duration: 120
    auto_land: true
    # 地面接触会被忽略；同一障碍物持续接触只记一次。
    max_collision_episodes: 5
    collision_episode_gap: 0.5

