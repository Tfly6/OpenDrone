# Run --dry-run first to inspect the expanded cases:
# python3 -m flight_eval batch -f batch_example.yaml --dry-run
version: 1
# manifests:
#   - external_algorithm_manifest.yaml
name: test

# Omitting output_dir creates eval_runs/batches/<name>_<timestamp>/.
# output_dir: ./results/controller_and_online_planner

defaults:
  simulation:
    # Required. ROS_PACKAGE_PATH and rospack are unreliable after sourcing
    # devel/setup.bash, so use the local PX4-Autopilot absolute path.
    px4:
      source_dir: /home/test/PX4-Autopilot
      # build_dir: /path/to/PX4-Autopilot/build/px4_sitl_default
      sim_model: gazebo-classic_iris
    # Gazebo and PX4 use a reconnectable UDP link. Run prepare-environment,
    # source the generated environment.env, and start environment.launch manually.
    transport:
      gazebo_px4: udp
      port: 14560
      environment_dir: /tmp/flight_eval_udp_environment
    mavros:
      fcu_url: udp://:14540@localhost:14557
      # Each case restarts PX4, so MAVROS must reconnect automatically.
      respawn_mavros: true
    gazebo:
      # Defaults to true; batch experiments show the Gazebo GUI unless overridden.
      gui: false
      # Each case restarts PX4, so Gazebo must recover automatically.
      respawn_gazebo: true
      x: 0
      y: 0
      z: 0
  run:
    takeoff_height: 2.0
    # duration: 120
    auto_land: true
    # Ground contact is ignored; continuous contact with one obstacle counts once.
    max_collision_episodes: 5
    collision_episode_gap: 0.5

experiments:
  - name: discrete_circle    # ← experiment 1
    task: discrete_circle
    controllers:
      - px4_position_baseline
      - se3_hopf
      - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      - pid_controller
    planners:
      - mav_trajectory
    repeat: 5
    simulation:
      world: empty
      sensor: none
    run:
      duration: 80
  - name: discrete_circle    # ← experiment 1
    task: discrete_circle
    controllers:
      - px4_position_baseline
      - se3_hopf
      - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      - pid_controller
    planners:
      - rpg_trajectory   #duration: 50
    repeat: 5
    simulation:
      world: empty
      sensor: none
    run:
      duration: 50
  - name: discrete_figure8   # ← experiment 2
    task: discrete_figure8
    controllers:
      - px4_position_baseline
      - se3_hopf
      - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      - pid_controller
    planners:
      - mav_trajectory
      - rpg_trajectory   #duration: 50
    repeat: 5
    simulation:
      world: empty
      sensor: none
    run:
      duration: 110
  - name: analytic_figure8
    task: analytic_figure8
    controllers:
      - px4_position_baseline
      - se3_hopf
      - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      - pid_controller
    repeat: 5
    simulation:
      world: empty
      sensor: none
    run:
      duration: 41
  - name: analytic_circle
    task: analytic_circle
    controllers:
      - px4_position_baseline
      - se3_hopf
      - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      - pid_controller
    repeat: 5
    simulation:
      world: empty
      sensor: none
    run:
      duration: 41
  - name: analytic_spiral
    task: analytic_spiral
    controllers:
      - px4_position_baseline
      - se3_hopf
      - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      - pid_controller
    repeat: 5
    simulation:
      world: empty
      sensor: none
    run:
      duration: 40
