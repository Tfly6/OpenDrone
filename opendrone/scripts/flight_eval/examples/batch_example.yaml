  # For Mid360, copy this YAML and start the matching Gazebo + MAVROS environment.
  # A batch cannot switch its external world or sensor.
  # controller x planner x repeat is a Cartesian product, yielding 2 * 2 * 2 cases.
  - name: online_mission
    task: sequential_goal_mission
    controllers:
      # - px4_position_baseline
      # - se3_hopf
      # - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      # - pid_controller
    planners:
      # - name: ego_planner
      - name: ego_planner_mid360
      # - name: ego_planner_v2
      # - name: fast_planner_kino
      # - name: fast_planner_topo
      # - name: airfar_planner
      # - name: airfar_planner_mid360
      - name: super_planner_od
    repeat: 2
    simulation:
      world: cylinders_85_45
      # sensor: depth_camera
      sensor: Mid360
    planner_args:
      use_mpc: 'true'
