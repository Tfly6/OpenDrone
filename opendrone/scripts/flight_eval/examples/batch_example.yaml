  # 若要跑 Mid360，请复制为另一份 YAML，并先手动启动 Mid360 对应的
  # Gazebo + MAVROS 环境；一个 batch 不能切换外部 world/sensor。
  # controller × planner × repeat 为笛卡尔积；这个实验会产生 2 * 2 * 2 = 8 条样本。
  - name: online_mission
    task: plan_mission
    controllers:
      # - px4_position_baseline
      # - se3_hopf
      # - se3_lee
      - mav_linear_mpc
      - mav_nonlinear_mpc
      - lqr_controller
      # - pid_controller
    planners:
      # - name: ego_planner
      - name: ego_planner_mid360
      # - name: ego_planner_v2
      # - name: fast_planner_kino
      # - name: fast_planner_topo
      # - name: airfar_planner
      # - name: airfar_planner_mid360
      - name: super_planner_od
    repeat: 2
    simulation:
      world: cylinders_85_45
      # sensor: depth_camera
      sensor: Mid360
    planner_args:
      use_mpc: 'true'
    # run:
    #   duration: 30
    # plan_mission 默认使用 finite manual path；如需自定义 launch 参数，
    # planner_args 会对本 experiment 的所有 planner 生效。
