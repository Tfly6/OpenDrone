name: ROS Noetic Catkin Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  catkin-build:
    name: Ubuntu 20.04 / ROS Noetic
    runs-on: ubuntu-22.04
    container: osrf/ros:noetic-desktop-full-focal

    steps:
      - name: Install Git (required for checkout with submodules)
        run: |
          apt-get update
          apt-get install --no-install-recommends -y git ca-certificates

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and native dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            python3-catkin-tools \
            python3-rosdep \
            libgoogle-glog-dev \
            libgflags-dev \
            libeigen3-dev \
            libarmadillo-dev \
            liblapacke-dev \
            libdw-dev \
            libnlopt-dev \
            libopenblas-dev \
            liblapack-dev \
            libopencv-dev \
            libyaml-cpp-dev

      - name: Install ROS package dependencies
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          rosdep init || true
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro noetic -r -y

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          mkdir -p "$HOME/catkin_ws/src"
          ln -s "$GITHUB_WORKSPACE" "$HOME/catkin_ws/src/OpenDrone"
          cd "$HOME/catkin_ws"
          catkin init
          catkin build
